<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <!------------------------- TABELAS EM HTML  ---------------------------->
    <table border = "1">  <!-- ESTRUTURA DA TABELA -->

        <thead> <!-- Cabeçalho tabela -->

            <tr> <!-- LINHA-->
                <th> Pos </th> <!-- DADOS DO CABEÇALHO -->
                <th> Piloto </th>
                <th> Pontos </th>
                <th> Vitoria </th>
                <th> Podios </th>
            </tr>
        </thead>

        <tbody> <!-- CORPO DA TEBELA -->

            <tr> <!--1° LINHA COM VARIOS DADOS-->
                <td> 1 </td> <!-- DADOS DA TABELA-->
                <td> A, Antonelli e</td>
                <td> 292 </td>
                <td> 8 </td>
                <td> 12 </td>
            </tr>

            <tr> <!--2° LINHA COM VARIOS DADOS-->
                <td> 2</td>
                <td> G.Russeu</td>
                <td> 211 </td>
                <td> 2 </td>
                <td> 7 </td>
            </tr>

        </tbody>

    </table>

</body>
</html>
